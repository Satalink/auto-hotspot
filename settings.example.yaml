# Auto Hotspot configuration
# Copy this file to settings.yaml and replace the example values.

PhoneHotspotSsid: "phone-hostspot-ssid-1"

FallbackSsids:
  - "wifi-ssid-1"
  - "wifi-ssid-2"
  - "wifi-ssid-3"

WifiInterfaceAlias: "Wi-Fi"
PollSeconds: 30
PhoneUnavailableThreshold: 3
PhoneProbeMinutes: 3